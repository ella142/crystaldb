[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "crystaldb"
version = "0.1.2"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1",
    "gemmi>=0.7",
    "pymongo>=4.18",
    "requests>=2.32",
    "beautifulsoup4>=4.12",
    "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
test = [
    "httpx>=0.27",
    "pytest>=8",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
