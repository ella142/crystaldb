[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "crystaldb"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "gemmi>=0.7",
    "pymongo>=4.18",
    "requests>=2.32",
    "beautifulsoup4>=4.12",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools]
package-dir = {"" = "src"} 